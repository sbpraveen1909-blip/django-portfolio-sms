<!DOCTYPE html>
<html>
<head>
    <title>{% if student %}Edit{% else %}Add{% endif %} Student</title>
</head>
<body>
    <h1>{% if student %}Edit{% else %}Add{% endif %} Student</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Name"
               value="{{ student.name|default:'' }}" required><br><br>

        <input type="email" name="email" placeholder="Email"
               value="{{ student.email|default:'' }}" required><br><br>

        <input type="text" name="course" placeholder="Course"
               value="{{ student.course|default:'' }}" required><br><br>

        <input type="text" name="phone" placeholder="Phone"
               value="{{ student.phone|default:'' }}" required><br><br>

        <textarea name="address" placeholder="Address" required>{{ student.address|default:'' }}</textarea><br><br>

        <button type="submit">Save Student</button>
    </form>

    <a href="{% url 'student_list' %}">Back</a>
</body>
</html>
